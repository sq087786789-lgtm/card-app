<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>名片管家</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>名片管家</h1>
    <div class="topbar-actions">
      <button id="btnSettings" class="icon-btn" title="設定">⚙️</button>
      <button id="btnImportOCR" class="icon-btn" title="匯入 OCR 結果">📋</button>
      <button id="btnSync" class="icon-btn" title="同步雲端名片">🔄</button>
      <button id="btnImport" class="icon-btn" title="匯入 vCard">📥</button>
      <button id="btnExport" class="icon-btn" title="匯出 vCard">📤</button>
    </div>
  </header>

  <!-- 設定 Modal -->
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content" style="max-width:480px;border-radius:16px">
      <button class="modal-close" id="settingsClose">✕</button>
      <h2 style="margin:0 0 16px">設定</h2>

      <div class="setting-row">
        <label style="font-weight:600;font-size:14px">OCR 引擎</label>
        <div style="padding:10px;background:#f1f5f9;border-radius:8px;margin-top:6px;font-size:14px;color:var(--muted)">
          🤖 由 M3 人工 OCR（雲端同步）
          <p style="font-size:12px;margin:6px 0 0">
            把名片圖丟到 <code>inbox/</code>，跟 M3 說「OCR」即可。<br>
            PWA 開啟時會自動從 GitHub 同步最新的 <code>cards.json</code>。
          </p>
        </div>
      </div>

      <div id="apiSettings" class="setting-row hidden">
        <label style="font-weight:600;font-size:14px">後端 API URL <span style="color:var(--muted);font-weight:400">（選填，留空關閉）</span></label>
        <input id="apiUrl" type="url" placeholder="https://your-app.up.railway.app" style="width:100%;padding:10px;font-size:15px;border:1px solid var(--border);border-radius:8px;margin-top:6px" />
        <p style="font-size:12px;color:var(--muted);margin:6px 0 0">
          圖片會送到這個後端，由它呼叫 LLM Vision API。<br>
          後端程式碼在 repo 的 <code>server/</code> 目錄。
        </p>
        <button id="btnTestApi" type="button" class="secondary-btn" style="margin-top:10px;width:100%">🧪 測試連線</button>
        <p id="apiTestResult" style="font-size:12px;margin:8px 0 0"></p>
      </div>

      <div class="setting-row">
        <label style="font-weight:600;font-size:14px">資料</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px">
          <button id="btnClearAll" type="button" class="danger-btn" style="padding:10px;border-radius:8px">🗑️ 清空全部名片</button>
          <button id="btnExport2" type="button" class="secondary-btn" style="padding:10px;border-radius:8px">📤 匯出 vCard</button>
        </div>
      </div>

      <div style="margin-top:16px;font-size:12px;color:var(--muted);text-align:center">
        v1.1 · 資料存本機 IndexedDB
      </div>
    </div>
  </div>

  <main>
    <!-- 同步狀態 -->
    <div id="syncStatus" class="sync-status hidden">
      <span id="syncIcon">🔄</span>
      <span id="syncText">同步中...</span>
    </div>

    <!-- 搜尋列 -->
    <section class="search-row">
      <input id="searchInput" type="search" placeholder="🔍 搜尋 姓名 / 公司 / 電話 / 信箱 / 備註..." autocomplete="off" />
    </section>

    <!-- 拍照/上傳 -->
    <section class="actions-row">
      <label for="cameraInput" class="primary-btn">
        📷 拍名片
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
      </label>
      <label for="fileInput" class="secondary-btn">
        🖼️ 選圖片
        <input id="fileInput" type="file" accept="image/*" hidden />
      </label>
    </section>

    <!-- OCR 進度 -->
    <div id="ocrStatus" class="ocr-status hidden">
      <div class="spinner"></div>
      <span id="ocrText">讀取中...</span>
    </div>

    <!-- 編輯表單（OCR 完成後出現） -->
    <section id="editPanel" class="edit-panel hidden">
      <h2 id="editTitle">新名片</h2>
      <form id="cardForm">
        <div class="preview-row">
          <img id="cardImagePreview" alt="名片縮圖" />
        </div>
        <label>姓名 <input name="name" type="text" /></label>
        <label>公司 <input name="company" type="text" /></label>
        <label>公司（英文） <input name="companyEn" type="text" /></label>
        <label>職稱 <input name="title" type="text" /></label>
        <label>電話 <input name="phone" type="tel" /></label>
        <label>傳真 <input name="fax" type="tel" /></label>
        <label>信箱 <input name="email" type="email" /></label>
        <label>網站 <input name="website" type="url" /></label>
        <label>地址 <input name="address" type="text" /></label>
        <label>LINE <input name="line" type="text" /></label>
        <label>備註 <textarea name="note" rows="3"></textarea></label>

        <!-- OCR 原始文字，可改可刪 -->
        <details class="raw-text">
          <summary>OCR 原始文字</summary>
          <textarea name="rawText" rows="4" readonly></textarea>
        </details>

        <div class="form-actions">
          <button type="button" id="btnCancel" class="secondary-btn">取消</button>
          <button type="submit" class="primary-btn">💾 儲存</button>
        </div>
      </form>
    </section>

    <!-- 名片列表 -->
    <section class="list-section">
      <div class="list-header">
        <h2 id="listTitle">名片列表 (0)</h2>
      </div>
      <ul id="cardList" class="card-list"></ul>
      <p id="emptyHint" class="empty-hint">還沒有名片。點上方「拍名片」開始。</p>
    </section>
  </main>

  <!-- 詳情 Modal -->
  <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <input id="vcfImportInput" type="file" accept=".vcf,text/vcard" hidden />
  <input id="ocrImportInput" type="file" accept=".json,application/json" multiple hidden />

  <script src="app.js"></script>
</body>
</html>
