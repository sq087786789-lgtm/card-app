<body><main><article><a href="./">← 回到我的名片</a><h1>下載這台裝置的舊名片</h1><p>請使用原本存過名片的手機或瀏覽器。這裡只讀取舊版的本機資料，不會刪除名片、不會送到任何辨識服務。</p><button id="export">下載舊名片備份</button><p id="status" role="status">下載後，到新版「更多 → 備份與匯入」選擇這份 JSON 檔。</p><small>若照片只留下舊網址且未快取，備份會註明缺少照片，需另外補上。備份包含聯絡資料與照片，請保存於私人位置。公開 GitHub 的舊名片資料檔已停止提供。</small></article></main><script src="./data-recovery.js"></script><script src="./entry.js"></script></body></html>
